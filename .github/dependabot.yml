# Mises à jour automatiques : une PR par lot de nouvelles versions, à relire avant fusion. Les alertes de sécurité
# (Dependabot security updates, réglage du dépôt) restent immédiates, indépendamment de ce calendrier.
#
# Actions GitHub (.github/workflows/) : épinglées par empreinte (SHA) avec la version en commentaire ; Dependabot met à
# jour les deux. Concerne notamment aquasecurity/trivy-action : chaque nouvelle version de l'action embarque une version
# plus récente de Trivy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Une seule PR regroupant les mises à jour mineures et correctives ; les versions majeures arrivent dans des PR
    # séparées.
    groups:
      github-actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # Paquets npm : workspaces backend et frontend, un seul package-lock.json à la racine (e2e/ a le sien)
  - package-ecosystem: npm
    directories: [/, /e2e]
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    # Versions majeures traitées par des lots décidés, pas à la réception d'une PR (mineures et correctifs toujours
    # proposés ; alertes de sécurité non concernées) :
    #   - typescript : suivre le support de typescript-eslint et vue-tsc (typescript-eslint 8.73 : < 6.1) ;
    #   - @types/node : suit la version de Node de l'image, de la CI et d'engines (lot « version de Node »).
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps

  # Image de base du Dockerfile (épinglée par digest : chaque nouvelle image node:22-alpine est proposée)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Changement de version majeure de Node : lot dédié (Dockerfile, CI, engines, @types/node), jamais l'image seule
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: docker
