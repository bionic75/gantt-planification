name: Cleanup old images
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: snok/container-retention-policy@v3
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          images-name: ${{ github.event.repository.name }}
          cut-off: 30d
          keep-n-most-recent: 10
