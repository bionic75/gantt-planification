name: Deploy manually

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Docker image version'
                required: true
                default: x.y.z

jobs:
    deploy:
        name: Deploy Docker image
        runs-on: ubuntu-latest

        steps:
            # Les secrets écrits dans le .env de la VM doivent exister (sinon l'application ne démarrerait pas)
            - name: Check production secrets
              id: check-production-secrets
              env:
                  SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
                  APP_URL: ${{ secrets.PROD_APP_URL }}
                  APP_DATA_PATH: ${{ secrets.PROD_APP_DATA_PATH }}
              run: |
                  missing=""
                  [ ${#SESSION_SECRET} -ge 32 ] || missing="$missing PROD_SESSION_SECRET (32 caractères minimum)"
                  [ -n "$APP_URL" ] || missing="$missing PROD_APP_URL"
                  [ -n "$APP_DATA_PATH" ] || missing="$missing PROD_APP_DATA_PATH"
                  if [ -n "$missing" ]; then
                    echo "::error::Secrets manquants :$missing (Settings › Secrets and variables › Actions)"
                    exit 1
                  fi

            # Deploy docker image to CSP
            - name: Deploy image to SAMU Tools VM
              id: deploy-docker-image
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SAMU_TOOLS_HOST }}
                  username: ${{ secrets.SAMU_TOOLS_USERNAME }}
                  key: ${{ secrets.SAMU_TOOLS_PRIVATE_KEY }}
                  port: 22
                  passphrase: ${{ secrets.SAMU_TOOLS_PASSPHRASE }}
                  script: |
                      SAMU_TOOLS="planif-ressources"
                      cd samu/$SAMU_TOOLS
                      # .env complet, réécrit à chaque déploiement depuis les secrets GitHub (valeurs entre apostrophes :
                      # pas d'interprétation de « $ » par docker compose). Lisible par le seul compte de déploiement.
                      umask 077
                      cat > .env <<'EOF'
                      VERSION_PLANIF_RESSOURCES=${{ inputs.version }}
                      NODE_ENV=production
                      APP_DATA_PATH='${{ secrets.PROD_APP_DATA_PATH }}'
                      SESSION_SECRET='${{ secrets.PROD_SESSION_SECRET }}'
                      APP_URL='${{ secrets.PROD_APP_URL }}'
                      DB_HOST='${{ secrets.PROD_DB_HOST }}'
                      DB_PORT='${{ secrets.PROD_DB_PORT }}'
                      DB_NAME='${{ secrets.PROD_DB_NAME }}'
                      DB_USER='${{ secrets.PROD_DB_USER }}'
                      DB_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}'
                      EOF
                      sed -i 's/^[[:space:]]*//' .env
                      docker container stop $SAMU_TOOLS
                      docker container rm $SAMU_TOOLS
                      docker compose up -d
