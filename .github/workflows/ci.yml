name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint et tests
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Interface Vue (frontend/) : types, tests unitaires, build (servi ensuite par les tests du serveur)
      - name: Frontend type check
        run: npm run typecheck:front

      - name: Frontend tests
        run: npm run test:front

      - name: Frontend build
        run: npm run build:front

      - name: Tests
        run: npm test

  # Migrations et tests sur une vraie base, uniquement pour le fournisseur utilisé : variable du dépôt DB_PROVIDER
  # (Settings › Secrets and variables › Actions › Variables) = postgresql ou mysql. Absente ou sqlite : jobs ignorés,
  # SQLite étant couvert par le job précédent.
  # Identifiants de la base de test : secrets du dépôt CI_DB_USER et CI_DB_PASSWORD (MariaDB : aussi mot de passe root,
  # les tests créant une base par serveur de test).
  migrations-postgresql:
    name: Migrations et tests postgresql
    if: vars.DB_PROVIDER == 'postgresql'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: planning
          # Tri des textes selon les règles françaises, comme la base de production
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=fr-FR
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h localhost" --health-interval 5s --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DB_PROVIDER: postgresql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: planning
      DB_USER: ${{ secrets.CI_DB_USER }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: No drift between migrations and schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/postgresql/schema.prisma --exit-code

      - name: Tests
        run: |
          export TEST_DATABASE_URL="$(node -e 'const u = new URL("postgresql://localhost:5432/postgres"); u.username = encodeURIComponent(process.env.DB_USER); u.password = encodeURIComponent(process.env.DB_PASSWORD); console.log(u.href)')"
          npm test
        env:
          TEST_DB_PROVIDER: postgresql

  migrations-mysql:
    name: Migrations et tests mysql
    if: vars.DB_PROVIDER == 'mysql'
    runs-on: ubuntu-latest
    services:
      mariadb:
        # 10.10 minimum : collation utf8mb4_uca1400_ai_ci (règles Unicode 14, tri français correct)
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MARIADB_USER: ${{ secrets.CI_DB_USER }}
          MARIADB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MARIADB_DATABASE: planning
        ports: ['3306:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DB_PROVIDER: mysql
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: planning
      DB_USER: ${{ secrets.CI_DB_USER }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: No drift between migrations and schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/mysql/schema.prisma --exit-code

      # Connexion root (création des bases de test), même mot de passe que CI_DB_USER
      - name: Tests
        run: |
          export TEST_DATABASE_URL="$(node -e 'const u = new URL("mysql://localhost:3306/mysql"); u.username = "root"; u.password = encodeURIComponent(process.env.DB_PASSWORD); console.log(u.href)')"
          npm test
        env:
          TEST_DB_PROVIDER: mysql

  # Tests de bout en bout (Playwright BDD, dossier e2e/) sur l'application de la branche : base SQLite neuve,
  # jeu de données synthétique (e2e/scripts/seed.mjs), codes de double authentification lus dans Mailpit.
  # Instance jetable : mots de passe propres à ce job, aucun secret du dépôt.
  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    services:
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025', '8025:8025']
        env:
          # L'application s'authentifie toujours auprès du SMTP : identifiants acceptés, sans TLS
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Application
      PORT: 3000
      APP_URL: http://localhost:3000
      DB_PROVIDER: sqlite
      INITIAL_ADMIN_USERNAME: ci-bootstrap
      INITIAL_ADMIN_PASSWORD: Ci-Bootstrap-2026!
      # Chrome du runner pour les PDF des CRA
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      # Tests (logins des comptes : valeurs par défaut de e2e/support/config.js)
      E2E_BASE_URL: http://localhost:3000
      E2E_MAIL_PROVIDER: mailpit
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_SHARED_MAILBOX: shared@ci.local
      E2E_ADMINISTRATEUR_PASSWORD: Ci-E2e-Tests-2026!
      E2E_EXPERT_PASSWORD: Ci-E2e-Tests-2026!
      E2E_UTILISATEUR_PASSWORD: Ci-E2e-Tests-2026!
      E2E_RH_PASSWORD: Ci-E2e-Tests-2026!
      E2E_SEED_ADMIN_LOGIN: ci-bootstrap
      E2E_SEED_ADMIN_PASSWORD: Ci-Bootstrap-2026!
      E2E_SEED_SMTP_HOST: 127.0.0.1
      E2E_SEED_SMTP_PORT: 1025
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix e2e

      - name: Install Chromium (Playwright)
        run: npx --prefix e2e playwright install --with-deps chromium

      # Interface Vue construite comme en production (pas de serveur Vite)
      - name: Build frontend
        run: npm run build:front

      - name: Start application
        env:
          NODE_ENV: production
        run: |
          export DB_PATH="$RUNNER_TEMP/e2e-data"
          export SESSION_SECRET="$(openssl rand -hex 32)"
          mkdir -p "$DB_PATH"
          node scripts/db-migrate.mjs
          nohup node server.js > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/api/version; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Seed test data
        run: node e2e/scripts/seed.mjs

      # Scénarios à préalable externe (Internet, Asana) ou à paramètre global (inactivité) : exécution planifiée.
      # Les scénarios @anomalie-connue (@fail) passent tant que l'anomalie existe, échouent dès qu'elle est corrigée.
      - name: End-to-end tests
        working-directory: e2e
        run: npm test
        env:
          E2E_TAGS: not @manuel and not @destructif and not @exploitation and not @asana and not @lent and not @internet

      # Dump puis restauration de la base : seul, après les autres scénarios
      - name: End-to-end tests (restauration de la base)
        working-directory: e2e
        run: npm test
        env:
          E2E_TAGS: '@destructif and not @manuel and not @exploitation'
          E2E_WORKERS: 1
          E2E_RAPPORT: destructif

      # Rapport Allure des deux exécutions (résultats écrits par allure-playwright)
      - name: Allure report
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: |
          dirs=$(ls -d allure-results* 2>/dev/null || true)
          if [ -n "$dirs" ]; then npx allure generate $dirs --output allure-report --name "Planification e2e"; fi

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            e2e/playwright-report/
            e2e/playwright-report-destructif/
            e2e/cucumber-report/
            e2e/cucumber-report-destructif/
            e2e/monocart-report/
            e2e/monocart-report-destructif/
            e2e/allure-report/
            e2e/test-results/
            ${{ runner.temp }}/app.log
          retention-days: 14

  docker-build:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Client Prisma généré pour la base utilisée (variable du dépôt DB_PROVIDER, sqlite par défaut)
      - name: Build image
        run: docker build --build-arg DB_PROVIDER=${{ vars.DB_PROVIDER || 'sqlite' }} -t gantt-planification:ci .

      # Vérifie que l'image démarre (dépendances natives compilées pour Node 22 / Alpine) ; sans objet sans base
      # PostgreSQL / MariaDB à disposition
      - name: Smoke test
        if: (vars.DB_PROVIDER || 'sqlite') == 'sqlite'
        run: |
          docker run -d --name app -p 8080:8080 -e PORT=8080 -e SESSION_SECRET="$(openssl rand -hex 32)" -e APP_URL=http://localhost:8080 gantt-planification:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/version; then
              # Interface Vue présente dans l'image : point d'entrée référencé par la page et servi
              entree=$(curl -fs http://localhost:8080/ | grep -o '/vue/assets/[^"]*\.js' | head -n 1)
              if [ -n "$entree" ] && curl -fs -o /dev/null "http://localhost:8080$entree"; then exit 0; fi
              echo "Interface Vue absente de l'image"
              docker logs app
              exit 1
            fi
            sleep 1
          done
          docker logs app
          exit 1
