name: Deploy on version tag

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

env:
    REGISTRY: ghcr.io

jobs:
    build-push-deploy:
        name: Build, push and deploy Docker image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            # 1. Checkout source code
            - name: Checkout source code
              id: checkout-source-code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetches full history for better caching/context

            # 2. Set up Docker Buildx
            - name: Set up Docker Buildx
              id: setup-docker-buildx
              uses: docker/setup-buildx-action@v3

            # 3. Cache Docker layers
            - name: Cache Docker layers
              id: cache-docker-layers
              uses: actions/cache@v4
              with:
                  path: /tmp/.buildx-cache
                  key: ${{ runner.os }}-buildx-${{ github.sha }}
                  restore-keys: ${{ runner.os }}-buildx-

            # 4. Cache npm dependencies
            - name: Cache npm dependencies
              id: cache-npm-dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-

            # 5. Extract metadata
            - name: Extract metadata
              id: extract-metadata
              run: |
                  echo "DOCKER_TAG=${GITHUB_REF_NAME:1}" >> "$GITHUB_OUTPUT"
                  echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
                  echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                  echo "REPO_FULLNAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

            # 6. Login to Container Registry
            - name: Log in to Container Registry
              id: login-container-registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 7. Build prod image (loaded locally, not pushed yet)
            - name: Build production image
              id: build-docker-image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  load: true
                  push: false
                  # Client Prisma généré pour la base de production (variable du dépôt DB_PROVIDER, sqlite par défaut)
                  build-args: |
                      DB_PROVIDER=${{ vars.DB_PROVIDER || 'sqlite' }}
                  #platforms: linux/amd64
                  tags: |
                      ${{ env.REGISTRY }}/${{ steps.extract-metadata.outputs.REPO_FULLNAME }}:latest
                      ${{ env.REGISTRY }}/${{ steps.extract-metadata.outputs.REPO_FULLNAME }}:${{ steps.extract-metadata.outputs.SHORT_SHA }}
                      ${{ env.REGISTRY }}/${{ steps.extract-metadata.outputs.REPO_FULLNAME }}:${{ steps.extract-metadata.outputs.DOCKER_TAG }}
                  cache-from: type=local,src=/tmp/.buildx-cache

            # 8. Scan image with Trivy: fails on fixable HIGH/CRITICAL vulnerabilities
            # v0.35.0 is the only trivy-action tag not hijacked in the March 2026 supply chain attack (CVE-2026-33634)
            - name: Scan image with Trivy
              id: scan-docker-image
              uses: aquasecurity/trivy-action@0.35.0
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ steps.extract-metadata.outputs.REPO_FULLNAME }}:${{ steps.extract-metadata.outputs.DOCKER_TAG }}
                  version: v0.69.3
                  format: table
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  vuln-type: os,library
                  exit-code: '1'

            # 9. Push prod image (only reached if the scan passed)
            - name: Push production image
              id: push-docker-image
              run: docker push --all-tags ${{ env.REGISTRY }}/${{ steps.extract-metadata.outputs.REPO_FULLNAME }}

            # 10. Les secrets écrits dans le .env de la VM doivent exister (sinon l'application ne démarrerait pas)
            - name: Check production secrets
              id: check-production-secrets
              env:
                  SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
                  APP_URL: ${{ secrets.PROD_APP_URL }}
                  APP_DATA_PATH: ${{ secrets.PROD_APP_DATA_PATH }}
              run: |
                  missing=""
                  [ ${#SESSION_SECRET} -ge 32 ] || missing="$missing PROD_SESSION_SECRET (32 caractères minimum)"
                  [ -n "$APP_URL" ] || missing="$missing PROD_APP_URL"
                  [ -n "$APP_DATA_PATH" ] || missing="$missing PROD_APP_DATA_PATH"
                  if [ -n "$missing" ]; then
                    echo "::error::Secrets manquants :$missing (Settings › Secrets and variables › Actions)"
                    exit 1
                  fi

            # 11. Deploy to CSP
            - name: Deploy image to SAMU Tools VM
              id: deploy-docker-image
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SAMU_TOOLS_HOST }}
                  username: ${{ secrets.SAMU_TOOLS_USERNAME }}
                  key: ${{ secrets.SAMU_TOOLS_PRIVATE_KEY }}
                  port: 22
                  passphrase: ${{ secrets.SAMU_TOOLS_PASSPHRASE }}
                  script: |
                      echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
                      docker pull ${{ env.REGISTRY }}/${{ steps.extract-metadata.outputs.REPO_FULLNAME }}:${{ steps.extract-metadata.outputs.DOCKER_TAG }}
                      SAMU_TOOLS="planif-ressources"
                      cd samu/$SAMU_TOOLS
                      # .env complet, réécrit à chaque déploiement depuis les secrets GitHub (valeurs entre apostrophes :
                      # pas d'interprétation de « $ » par docker compose). Lisible par le seul compte de déploiement.
                      umask 077
                      cat > .env <<'EOF'
                      VERSION_PLANIF_RESSOURCES=${{ steps.extract-metadata.outputs.DOCKER_TAG }}
                      NODE_ENV=production
                      APP_DATA_PATH='${{ secrets.PROD_APP_DATA_PATH }}'
                      SESSION_SECRET='${{ secrets.PROD_SESSION_SECRET }}'
                      APP_URL='${{ secrets.PROD_APP_URL }}'
                      DB_HOST='${{ secrets.PROD_DB_HOST }}'
                      DB_PORT='${{ secrets.PROD_DB_PORT }}'
                      DB_NAME='${{ secrets.PROD_DB_NAME }}'
                      DB_USER='${{ secrets.PROD_DB_USER }}'
                      DB_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}'
                      EOF
                      sed -i 's/^[[:space:]]*//' .env
                      docker container stop $SAMU_TOOLS
                      docker container rm $SAMU_TOOLS
                      docker compose up -d
