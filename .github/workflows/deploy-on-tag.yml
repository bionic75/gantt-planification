name: Deploy on version tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-push-deploy:
    name: Build, push and deploy Docker image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        id: checkout-source-code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for better caching/context

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        id: setup-docker-buildx
        uses: docker/setup-buildx-action@v3

      # 3. Cache Docker layers
      - name: Cache Docker layers
        id: cache-docker-layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      # 4. Cache npm dependencies
      - name: Cache npm dependencies
        id: cache-npm-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      # 5. Extract metadata
      - name: Extract metadata
        id: extract-metadata
        run: |
          echo "DOCKER_TAG=${GITHUB_REF_NAME:1}" >> "$GITHUB_OUTPUT"
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 6. Login to Docker Hub
      - name: Log in to Docker Hub
        id: login-dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build and push prod image
      - name: Build and push production image
        id: push-docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          #platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.extract-metadata.outputs.DOCKER_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.extract-metadata.outputs.SHORT_SHA }}
          cache-from: type=local,src=/tmp/.buildx-cache

      # 8. Deploy to CSP
      - name: Deploy image to SAMU Tools VM
        id: deploy-docker-image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SAMU_TOOLS_HOST }}
          username: ${{ secrets.SAMU_TOOLS_USERNAME }}
          key: ${{ secrets.SAMU_TOOLS_PRIVATE_KEY }}
          port: 22
          passphrase: ${{ secrets.SAMU_TOOLS_PASSPHRASE }}
          script: |
            sudo docker login
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.extract-metadata.outputs.DOCKER_TAG }}
            SAMU_TOOLS="planif-ressources"
            cd samu/$SAMU_TOOLS
            echo "VERSION_PLANIF_RESSOURCES=${{ steps.extract-metadata.outputs.DOCKER_TAG }}" > .env
            docker container stop $SAMU_TOOLS
            docker container rm $SAMU_TOOLS
            docker compose up -d
