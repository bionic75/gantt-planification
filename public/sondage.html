<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sondage — SI-SAMU</title>
<style>
    :root { --bleu: #1d70b7; --fond: #f4f7fb; --bord: #d5deea; --texte: #1a2b3c; --doux: #6b7a8d; --ok: #1b7f3b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--fond); color: var(--texte); }
    header { background: #12344f; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .5px; font-size: 20px; }
    .logo svg { width: 26px; height: 26px; }
    .logo span { color: #6cc4ff; }
    main { max-width: 1000px; margin: 22px auto; padding: 0 16px; }
    .carte { background: #fff; border: 1px solid var(--bord); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 6px; color: var(--bleu); }
    .sous { color: var(--doux); font-size: 13px; margin: 0; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 420px; }
    th, td { border: 1px solid var(--bord); padding: 8px 10px; text-align: center; font-size: 13px; }
    th { background: #eef3f9; }
    th.nom, td.nom { text-align: left; min-width: 150px; }
    th .j { font-weight: 400; color: var(--doux); font-size: 11px; text-transform: capitalize; }
    th .h { font-weight: 700; color: var(--bleu); }
    td.oui { background: #e6f4ea; color: var(--ok); font-weight: 700; }
    td.non { color: #c5ced9; }
    tr.moi td { background: #fff8e1; }
    tr.total td { font-weight: 700; background: #f7f9fc; }
    td.best { box-shadow: inset 0 0 0 2px var(--ok); }
    input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--bord); border-radius: 8px; font-size: 14px; }
    input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; }
    button { background: var(--bleu); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .actions { margin-top: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .msg { font-size: 13px; }
    .msg.ok { color: var(--ok); } .msg.err { color: #b3261e; }
    .erreur { text-align: center; padding: 40px 10px; color: var(--doux); }
</style>
</head>
<body>
<header>
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6cc4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
        SI-<span>SAMU</span>
    </div>
</header>
<main id="app"><div class="erreur">Chargement…</div></main>
<script>
(function () {
    const token = location.pathname.split('/').filter(Boolean).pop();
    const app = document.getElementById('app');
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const dateFr = d => { const [y, m, j] = d.split('-').map(Number); return { jour: JOURS[new Date(Date.UTC(y, m - 1, j)).getUTCDay()], date: `${String(j).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}` }; };
    let data = null;

    function entete(o) {
        const f = dateFr(o.date);
        const h = o.heure ? `${o.heure}${o.heure_fin ? ' – ' + o.heure_fin : ''}` : '';
        return `<th><div class="j">${f.jour}</div><div class="h">${f.date}</div>${h ? `<div class="j">${h}</div>` : ''}</th>`;
    }
    function render(msg, err) {
        const opts = data.options;
        const totaux = opts.map(o => data.reponses.filter(r => r.options.includes(o.id)).length);
        const max = Math.max(0, ...totaux);
        const lignes = data.reponses.map(r => `<tr><td class="nom">${esc(r.nom)}</td>${opts.map(o => r.options.includes(o.id) ? '<td class="oui">✓</td>' : '<td class="non">–</td>').join('')}</tr>`).join('');
        app.innerHTML = `
            <div class="carte">
                <h1>${esc(data.nom)}</h1>
                <p class="sous">${data.organisateur ? 'Organisé par ' + esc(data.organisateur) + ' · ' : ''}Indiquez votre nom et cochez la ou les dates qui vous conviennent.</p>
            </div>
            <div class="carte">
                <div class="scroll"><table>
                    <thead><tr><th class="nom">Participants</th>${opts.map(entete).join('')}</tr></thead>
                    <tbody>
                        ${lignes}
                        <tr class="moi"><td class="nom"><input type="text" id="nom" maxlength="100" placeholder="Votre nom" autocomplete="name"></td>${opts.map(o => `<td><input type="checkbox" data-o="${o.id}" aria-label="Disponible"></td>`).join('')}</tr>
                        <tr class="total"><td class="nom">Total</td>${totaux.map(t => `<td class="${t && t === max ? 'best' : ''}">${t}</td>`).join('')}</tr>
                    </tbody>
                </table></div>
                <div class="actions"><button type="button" id="envoi">Enregistrer ma réponse</button><span class="msg ${err ? 'err' : 'ok'}" id="msg">${esc(msg || '')}</span></div>
            </div>`;
        document.getElementById('envoi').addEventListener('click', envoyer);
        // Une personne qui revient retrouve sa réponse en saisissant le même nom
        document.getElementById('nom').addEventListener('input', e => {
            const r = data.reponses.find(x => x.nom.toLowerCase() === e.target.value.trim().toLowerCase());
            if (r) document.querySelectorAll('input[data-o]').forEach(c => (c.checked = r.options.includes(Number(c.dataset.o))));
        });
    }
    async function envoyer() {
        const nom = document.getElementById('nom').value.trim();
        const options = [...document.querySelectorAll('input[data-o]:checked')].map(c => Number(c.dataset.o));
        const msg = document.getElementById('msg');
        if (!nom) { msg.className = 'msg err'; msg.textContent = 'Indiquez votre nom.'; return; }
        if (!options.length) { msg.className = 'msg err'; msg.textContent = 'Cochez au moins une date.'; return; }
        const btn = document.getElementById('envoi');
        btn.disabled = true;
        try {
            const r = await fetch(`/api/sondages-publics/${token}/reponses`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nom, options }) });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.error || `Erreur ${r.status}`);
            data = await (await fetch(`/api/sondages-publics/${token}`)).json();
            render(j.replaced ? 'Votre réponse a été mise à jour. Merci !' : 'Réponse enregistrée. Merci !');
        } catch (e) {
            btn.disabled = false;
            msg.className = 'msg err';
            msg.textContent = e.message;
        }
    }
    fetch(`/api/sondages-publics/${token}`).then(async r => {
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(r.status === 404 ? 'Ce sondage n’existe pas ou n’est plus disponible.' : j.error || `Erreur ${r.status}`);
        data = j;
        document.title = `${j.nom} — SI-SAMU`;
        render();
    }).catch(e => { app.innerHTML = `<div class="erreur">${esc(e.message)}</div>`; });
})();
</script>
</body>
</html>
