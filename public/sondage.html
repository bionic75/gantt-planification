<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sondage — SI-SAMU</title>
<style>
    :root { --bleu: #1d70b7; --fond: #f4f7fb; --bord: #d5deea; --texte: #1a2b3c; --doux: #6b7a8d; --ok: #1b7f3b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--fond); color: var(--texte); }
    header { background: #fff; border-bottom: 1px solid var(--bord); padding: 10px 20px; }
    header img { display: block; height: 48px; width: auto; }
    main { max-width: 1000px; margin: 22px auto; padding: 0 16px; }
    .carte { background: #fff; border: 1px solid var(--bord); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 6px; color: var(--bleu); }
    .sous { color: var(--doux); font-size: 13px; margin: 0; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 420px; }
    th, td { border: 1px solid var(--bord); padding: 8px 10px; text-align: center; font-size: 13px; }
    th { background: #eef3f9; }
    th.nom, td.nom { text-align: left; min-width: 150px; }
    th .j { font-weight: 400; color: var(--doux); font-size: 11px; text-transform: capitalize; }
    th .h { font-weight: 700; color: var(--bleu); }
    td.oui { background: #e6f4ea; color: var(--ok); font-weight: 700; }
    td.non { color: #c5ced9; }
    tr.moi td { background: #fff8e1; }
    tr.total td { font-weight: 700; background: #f7f9fc; }
    td.best { box-shadow: inset 0 0 0 2px var(--ok); }
    input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--bord); border-radius: 8px; font-size: 14px; }
    input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; }
    button { background: var(--bleu); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button.lien { background: none; color: var(--bleu); padding: 6px 4px; text-decoration: underline; font-weight: 400; }
    button:disabled { opacity: .6; cursor: default; }
    .actions { margin-top: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .msg { font-size: 13px; }
    .msg.ok { color: var(--ok); } .msg.err { color: #b3261e; }
    .retenu { background: #e6f4ea; border: 1px solid #1b7f3b; color: #14602c; border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-weight: 700; font-size: 14px; }
    .retenu.aucun { background: #f1f4f8; border-color: var(--bord); color: var(--doux); }
    th.choisi, td.choisi { box-shadow: inset 0 0 0 2px var(--ok); }
    .erreur { text-align: center; padding: 40px 10px; color: var(--doux); }
</style>
</head>
<body>
<header>
    <img src="/img/logo-telephonie-si-samu.png" alt="Téléphonie SI-SAMU — La e-santé française">
</header>
<main id="app"><div class="erreur">Chargement…</div></main>
<script>
(function () {
    const token = location.pathname.split('/').filter(Boolean).pop();
    const app = document.getElementById('app');
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const dateFr = d => { const [y, m, j] = d.split('-').map(Number); return { jour: JOURS[new Date(Date.UTC(y, m - 1, j)).getUTCDay()], date: `${String(j).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}` }; };
    // Seule la réponse de la personne est transmise par le serveur (jeton secret gardé dans ce navigateur) : les choix
    // des autres participants ne sont jamais visibles
    const memoKey = `sondage-jeton-${token}`;
    let jeton = '';
    try { jeton = localStorage.getItem(memoKey) || ''; } catch (e) { /* stockage indisponible */ }
    const memoriser = j => { jeton = j || ''; try { if (j) localStorage.setItem(memoKey, j); else localStorage.removeItem(memoKey); } catch (e) { /* stockage indisponible */ } };
    let data = null;
    let retenueId = null;

    function entete(o) {
        const f = dateFr(o.date);
        const h = o.heure ? `${o.heure}${o.heure_fin ? ' – ' + o.heure_fin : ''}` : '';
        return `<th class="${retenueId === o.id ? 'choisi' : ''}"><div class="j">${f.jour}</div><div class="h">${f.date}</div>${h ? `<div class="j">${h}</div>` : ''}</th>`;
    }
    async function charger() {
        const r = await fetch(`/api/sondages-publics/${token}`, { headers: { 'X-Reponse-Jeton': jeton } });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(r.status === 404 ? 'Ce sondage n’existe pas ou n’est plus disponible.' : j.error || `Erreur ${r.status}`);
        data = j;
        // Jeton refusé (réponse supprimée) : on repart d'une réponse vierge
        if (jeton && !j.mienne) memoriser('');
    }
    function render(msg, err) {
        const opts = data.options;
        const mine = data.mienne;
        const ret = data.termine ? opts.find(o => o.id === data.retenue) : null;
        retenueId = ret ? ret.id : null;
        const f = ret && dateFr(ret.date);
        const bandeau = data.termine
            ? (ret ? `<div class="retenu">✔ Sondage clôturé — créneau retenu : ${f.jour} ${f.date}${ret.heure ? ' · ' + ret.heure + (ret.heure_fin ? ' – ' + ret.heure_fin : '') : ''}</div>` : '<div class="retenu aucun">Sondage clôturé — aucun créneau n’a été retenu.</div>')
            : '';
        const ligne = data.termine
            ? (mine ? `<tr class="moi"><td class="nom">${esc(mine.nom)}</td>${opts.map(o => mine.options.includes(o.id) ? '<td class="oui">✓</td>' : '<td class="non">–</td>').join('')}</tr>` : '')
            : `<tr class="moi"><td class="nom"><input type="text" id="nom" maxlength="100" placeholder="Votre nom" autocomplete="name" value="${mine ? esc(mine.nom) : ''}"></td>${opts.map(o => `<td><input type="checkbox" data-o="${o.id}" aria-label="Disponible" ${mine && mine.options.includes(o.id) ? 'checked' : ''}></td>`).join('')}</tr>`;
        app.innerHTML = `
            <div class="carte">
                <h1>${esc(data.nom)}</h1>
                ${data.atelier ? `<p class="sous" style="margin-bottom:4px;"><b>Atelier :</b> ${esc(data.atelier)}</p>` : ''}
                ${data.objectif ? `<p class="sous" style="margin-bottom:6px;"><b>Objectif de l’atelier :</b> ${esc(data.objectif)}</p>` : ''}
                <p class="sous">${data.organisateur ? 'Organisé par ' + esc(data.organisateur) + ' · ' : ''}${data.termine ? 'Les réponses ne sont plus modifiables.' : 'Indiquez votre nom et cochez la ou les dates qui vous conviennent. Les réponses des autres participants ne sont pas affichées.'}</p>
                ${bandeau}
            </div>
            <div class="carte">
                <div class="scroll"><table>
                    <thead><tr><th class="nom">${mine || !data.termine ? 'Votre réponse' : 'Dates'}</th>${opts.map(entete).join('')}</tr></thead>
                    <tbody>${ligne}</tbody>
                </table></div>
                ${data.termine ? '' : `<div class="actions"><button type="button" id="envoi">${mine ? 'Modifier ma réponse' : 'Enregistrer ma réponse'}</button>${mine ? '<button type="button" id="autre" class="lien">Ce n’est pas moi</button>' : ''}<span class="msg ${err ? 'err' : 'ok'}" id="msg">${esc(msg || '')}</span></div>`}
            </div>`;
        if (data.termine) return;
        document.getElementById('envoi').addEventListener('click', envoyer);
        const autre = document.getElementById('autre');
        if (autre) autre.addEventListener('click', () => { memoriser(''); data.mienne = null; render(); });
    }
    async function envoyer() {
        const nom = document.getElementById('nom').value.trim();
        const options = [...document.querySelectorAll('input[data-o]:checked')].map(c => Number(c.dataset.o));
        const msg = document.getElementById('msg');
        if (!nom) { msg.className = 'msg err'; msg.textContent = 'Indiquez votre nom.'; return; }
        if (!options.length) { msg.className = 'msg err'; msg.textContent = 'Cochez au moins une date.'; return; }
        const btn = document.getElementById('envoi');
        btn.disabled = true;
        try {
            const r = await fetch(`/api/sondages-publics/${token}/reponses`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nom, options, jeton }) });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.error || `Erreur ${r.status}`);
            memoriser(j.jeton);
            await charger();
            render(j.replaced ? 'Votre réponse a été mise à jour. Merci !' : 'Réponse enregistrée. Merci !');
        } catch (e) {
            btn.disabled = false;
            msg.className = 'msg err';
            msg.textContent = e.message;
        }
    }
    charger().then(() => { document.title = `${data.nom} — SI-SAMU`; render(); }).catch(e => { app.innerHTML = `<div class="erreur">${esc(e.message)}</div>`; });
})();
</script>
</body>
</html>
