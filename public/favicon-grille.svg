<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond -->
  <rect width="32" height="32" fill="#1e293b"/>
  
  <!-- Grille de planning -->
  <rect x="4" y="4" width="24" height="24" fill="none" stroke="#475569" stroke-width="1"/>
  
  <!-- Lignes verticales -->
  <line x1="12" y1="4" x2="12" y2="28" stroke="#475569" stroke-width="0.5"/>
  <line x1="20" y1="4" x2="20" y2="28" stroke="#475569" stroke-width="0.5"/>
  
  <!-- Lignes horizontales -->
  <line x1="4" y1="12" x2="28" y2="12" stroke="#475569" stroke-width="0.5"/>
  <line x1="4" y1="20" x2="28" y2="20" stroke="#475569" stroke-width="0.5"/>
  
  <!-- Cases remplies (affectations) -->
  <rect x="12.5" y="4.5" width="7" height="7" fill="#3b82f6" opacity="0.6"/>
  <rect x="4.5" y="12.5" width="7" height="7" fill="#8b5cf6" opacity="0.6"/>
  <rect x="20.5" y="12.5" width="7" height="7" fill="#ec4899" opacity="0.6"/>
  <rect x="12.5" y="20.5" width="7" height="7" fill="#10b981" opacity="0.6"/>
  
  <!-- Point focal central -->
  <circle cx="16" cy="16" r="4" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
</svg>